<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu de navegação — componente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     TOKENS — troque estas variáveis para adaptar ao seu site
     ========================================================== */
  :root {
    --bg-nav:      #FAF7F2;   /* fundo do menu (papel/marfim) */
    --ink:         #1F1D1A;   /* texto principal */
    --ink-muted:   #6B675E;   /* texto secundário / linhas do hamburguer */
    --accent:      #35533F;   /* cor de destaque (verde pinho) */
    --border:      rgba(31, 29, 26, 0.08);
    --nav-height:        84px;
    --nav-height-mobile: 64px;
    --side-padding:        48px;
    --side-padding-mobile: 24px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
    color: var(--ink);
    background: #fff;
  }

  /* ==========================================================
     BARRA DE NAVEGAÇÃO — fixa no topo
     ========================================================== */
  .site-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: var(--nav-height);
    background: var(--bg-nav);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--side-padding);
    z-index: 1000;
  }

  /* ---------- Logo (lado esquerdo) ---------- */
  .site-nav__brand {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--ink);
    flex-shrink: 0;
  }

  .site-nav__brand svg {
    width: 34px;
    height: 34px;
    display: block;
  }

  .site-nav__brand-name {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }

  /* ---------- Links (lado direito, desktop) ---------- */
  .site-nav__links {
    display: flex;
    align-items: center;
    gap: 40px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .site-nav__links a {
    position: relative;
    color: var(--ink);
    text-decoration: none;
    font-size: 0.98rem;
    font-weight: 500;
    padding: 6px 0;
  }

  .site-nav__links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 2px;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  .site-nav__links a:hover::after,
  .site-nav__links a:focus-visible::after {
    width: 100%;
  }

  .site-nav__links a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
    border-radius: 2px;
  }

  /* ---------- Botão hamburguer (só aparece no mobile) ---------- */
  .site-nav__toggle {
    display: none;
    position: relative;
    width: 32px;
    height: 24px;
    background: transparent;
    border: none;
    padding: 0;
    cursor: pointer;
    flex-shrink: 0;
  }

  .site-nav__toggle span {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: var(--ink-muted);
    border-radius: 2px;
    transition: transform 0.25s ease, opacity 0.2s ease, top 0.25s ease;
  }

  .site-nav__toggle span:nth-child(1) { top: 0; }
  .site-nav__toggle span:nth-child(2) { top: 11px; }
  .site-nav__toggle span:nth-child(3) { top: 22px; }

  .site-nav__toggle:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  /* estado aberto: transforma os três traços em um "X" */
  .site-nav.is-open .site-nav__toggle span:nth-child(1) {
    top: 11px;
    transform: rotate(45deg);
  }
  .site-nav.is-open .site-nav__toggle span:nth-child(2) {
    opacity: 0;
  }
  .site-nav.is-open .site-nav__toggle span:nth-child(3) {
    top: 11px;
    transform: rotate(-45deg);
  }

  /* ==========================================================
     RESPONSIVO — abaixo do breakpoint vira menu hamburguer
     ========================================================== */
  @media (max-width: 760px) {
    .site-nav {
      height: var(--nav-height-mobile);
      padding: 0 var(--side-padding-mobile);
    }

    .site-nav__toggle {
      display: block;
    }

    .site-nav__links {
      position: absolute;
      top: var(--nav-height-mobile);
      left: 0;
      width: 100%;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      background: var(--bg-nav);
      border-bottom: 1px solid var(--border);
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .site-nav.is-open .site-nav__links {
      max-height: 320px; /* alto o suficiente pra caber todos os links */
    }

    .site-nav__links a {
      width: 100%;
      padding: 16px var(--side-padding-mobile);
      border-top: 1px solid var(--border);
    }

    .site-nav__links a::after {
      display: none; /* sublinhado não faz sentido no menu empilhado */
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .site-nav__toggle span,
    .site-nav__links,
    .site-nav__links a::after {
      transition: none;
    }
  }

  /* ==========================================================
     Conteúdo de demonstração — remova ao integrar ao seu site
     ========================================================== */
  main {
    padding: calc(var(--nav-height) + 64px) var(--side-padding) 120px;
    max-width: 640px;
  }
  @media (max-width: 760px) {
    main { padding: calc(var(--nav-height-mobile) + 40px) var(--side-padding-mobile) 80px; }
  }
  main h1 { font-size: 1.6rem; margin-bottom: 8px; }
  main p  { color: var(--ink-muted); line-height: 1.6; }
</style>
</head>
<body>

<nav class="site-nav" id="siteNav">
  <!-- LOGO — SVG temporário, troque pela sua arte final -->
  <a href="#" class="site-nav__brand" aria-label="Página inicial">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="2" width="36" height="36" rx="8" stroke="currentColor" stroke-width="2"/>
      <path d="M12 26 L20 14 L28 26" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="site-nav__brand-name">Logotipo</span>
  </a>

  <!-- LINKS — lista de páginas do site -->
  <ul class="site-nav__links" id="siteNavLinks">
    <li><a href="#">Início</a></li>
    <li><a href="#">Sobre</a></li>
    <li><a href="#">Projetos</a></li>
    <li><a href="#">Contato</a></li>
  </ul>

  <!-- BOTÃO HAMBURGUER — só visível abaixo do breakpoint -->
  <button class="site-nav__toggle" id="siteNavToggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="siteNavLinks">
    <span></span><span></span><span></span>
  </button>
</nav>

<main>
  <h1>Conteúdo da página</h1>
  <p>Diminua a largura da janela para ver o menu se transformar em hamburguer. Este bloco é só para demonstrar o espaçamento abaixo do menu fixo — pode remover ao integrar o componente ao seu projeto.</p>
</main>

<script>
  (function () {
    const nav = document.getElementById('siteNav');
    const toggle = document.getElementById('siteNavToggle');

    toggle.addEventListener('click', function () {
      const isOpen = nav.classList.toggle('is-open');
      toggle.setAttribute('aria-expanded', String(isOpen));
      toggle.setAttribute('aria-label', isOpen ? 'Fechar menu' : 'Abrir menu');
    });

    // fecha o menu automaticamente se a tela crescer de novo e passar o breakpoint
    window.addEventListener('resize', function () {
      if (window.innerWidth > 760 && nav.classList.contains('is-open')) {
        nav.classList.remove('is-open');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.setAttribute('aria-label', 'Abrir menu');
      }
    });
  })();
</script>

</body>
</html>
